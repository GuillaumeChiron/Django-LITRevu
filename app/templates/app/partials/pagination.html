<section class="pagination" aria-label="Navigation des pages">
    {% if page_posts.has_previous %}
    <a class="pagination-link" href="?page=1" aria-label="Aller a la premiere page"><< Premiere</a>
    <a class="pagination-link" href="?page={{ page_posts.previous_page_number }}" rel="prev" aria-label="Aller a la page precedente">< Precedente</a>
    {% else %}
    <span class="pagination-link is-disabled" aria-disabled="true"><< Premiere</span>
    <span class="pagination-link is-disabled" aria-disabled="true">< Precedente</span>
    {% endif %}

    <span class="pagination-current" aria-current="page">
        Page {{ page_posts.number }} / {{ page_posts.paginator.num_pages }}
    </span>

    {% if page_posts.has_next %}
    <a class="pagination-link" href="?page={{ page_posts.next_page_number }}" rel="next" aria-label="Aller a la page suivante">Suivante ></a>
    <a class="pagination-link" href="?page={{ page_posts.paginator.num_pages }}" aria-label="Aller a la derniere page">Derniere >></a>
    {% else %}
    <span class="pagination-link is-disabled" aria-disabled="true">Suivante ></span>
    <span class="pagination-link is-disabled" aria-disabled="true">Derniere >></span>
    {% endif %}
</section>
