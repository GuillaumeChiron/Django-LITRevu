<section class="pagination" aria-label="Pagination">
    {% if page_posts.has_previous %}
    <a class="pagination-link pagination-link-nav" href="?page=1" aria-label="Première page">Première</a>
    <a class="pagination-link pagination-link-nav" href="?page={{ page_posts.previous_page_number }}" aria-label="Page précédente">Précédente</a>
    {% else %}
    <span class="pagination-link pagination-link-nav is-disabled" aria-hidden="true">Première</span>
    <span class="pagination-link pagination-link-nav is-disabled" aria-hidden="true">Précédente</span>
    {% endif %}

    <span class="pagination-current" aria-live="polite">
        <span class="pagination-current-label">Page</span>
        <strong>{{ page_posts.number }}</strong>
        <span class="pagination-current-label">/</span>
        <strong>{{ page_posts.paginator.num_pages }}</strong>
    </span>

    {% if page_posts.has_next %}
    <a class="pagination-link pagination-link-nav" href="?page={{ page_posts.next_page_number }}" aria-label="Page suivante">Suivante</a>
    <a class="pagination-link pagination-link-nav" href="?page={{ page_posts.paginator.num_pages }}" aria-label="Dernière page">Dernière</a>
    {% else %}
    <span class="pagination-link pagination-link-nav is-disabled" aria-hidden="true">Suivante</span>
    <span class="pagination-link pagination-link-nav is-disabled" aria-hidden="true">Dernière</span>
    {% endif %}
</section>
