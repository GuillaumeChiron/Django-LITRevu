<div class="card-actions">
    {% if post.user == user %}
    <a class="feed-btn small" href="{% url 'edit-ticket' post.id %}">Modifier</a>
    {% endif %}
    {% if post.id not in reviewed_ticket_ids %}
    <a class="feed-btn small" href="{% url 'create-review' post.id %}">Créer une critique</a>
    {% endif %}
</div>
